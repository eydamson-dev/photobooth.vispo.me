<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Upload Photos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; }
    .drop-active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.08); }
    .progress-bg { background: rgba(255,255,255,0.1); }
    .progress-fill { transition: width .2s ease; }
    .thumb { object-fit: cover; }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pop { animation: pop .25s ease; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 bg-[#0f172a]/90 backdrop-blur border-b border-slate-700/50">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="header-logo" src="" alt="" class="w-10 h-10 rounded-xl object-contain bg-white hidden">
        <div id="header-fallback" class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L6 8m4-4v12" />
          </svg>
        </div>
        <div>
          <h1 id="header-title" class="text-xl font-bold leading-tight">Upload Photos</h1>
          <p class="text-xs text-slate-400"><span id="header-org">Pick or drop multiple images</span></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/settings" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition" title="Settings">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </a>
        <a href="/" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium transition">Gallery</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-6">
    <!-- Drop zone -->
    <div id="dropzone" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center cursor-pointer transition hover:border-slate-500 mb-6">
      <div class="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-3">
        <svg class="w-7 h-7 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <p class="text-lg font-semibold">Tap or drop photos here</p>
      <p class="text-sm text-slate-400 mt-1">PNG, JPG, WEBP, GIF — up to 25 MB each</p>
      <input id="fileinput" type="file" accept="image/*" multiple class="hidden">
    </div>

    <!-- File list -->
    <div id="filelist" class="space-y-3 hidden"></div>

    <!-- Actions -->
    <div id="actions" class="hidden mt-6 flex flex-wrap items-center gap-3">
      <button id="uploadBtn" class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
        Upload all
      </button>
      <button id="clearBtn" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold transition">
        Clear
      </button>
      <span id="summary" class="text-sm text-slate-400"></span>
    </div>

    <!-- Overall status -->
    <div id="status" class="hidden mt-6 p-4 rounded-xl text-center font-medium"></div>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileinput');
    const fileList = document.getElementById('filelist');
    const actions = document.getElementById('actions');
    const uploadBtn = document.getElementById('uploadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const summary = document.getElementById('summary');
    const status = document.getElementById('status');
    const headerLogo = document.getElementById('header-logo');
    const headerFallback = document.getElementById('header-fallback');
    const headerTitle = document.getElementById('header-title');
    const headerOrg = document.getElementById('header-org');

    let items = []; // { file, id, status: 'queued'|'uploading'|'done'|'error', progress: 0, response }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => addFiles(e.target.files));

    ['dragenter','dragover','dragleave','drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
    });
    ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, () => dropzone.classList.add('drop-active')));
    ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, () => dropzone.classList.remove('drop-active')));
    dropzone.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));

    function addFiles(fileListObj) {
      if (!fileListObj) return;
      const newFiles = Array.from(fileListObj).filter(f => f.type.startsWith('image/'));
      if (newFiles.length === 0) {
        showStatus('Please select image files only.', 'bg-red-500/20 text-red-200');
        return;
      }
      newFiles.forEach(file => items.push({ file, id: crypto.randomUUID(), status: 'queued', progress: 0 }));
      render();
      hideStatus();
    }

    function render() {
      if (items.length === 0) {
        fileList.classList.add('hidden');
        actions.classList.add('hidden');
        fileList.innerHTML = '';
        return;
      }
      fileList.classList.remove('hidden');
      actions.classList.remove('hidden');

      const uploading = items.some(i => i.status === 'uploading');
      uploadBtn.disabled = uploading || items.every(i => i.status === 'done' || i.status === 'error');
      uploadBtn.textContent = uploading ? 'Uploading…' : 'Upload all';

      const done = items.filter(i => i.status === 'done').length;
      const errors = items.filter(i => i.status === 'error').length;
      summary.textContent = `${done}/${items.length} done${errors ? ` • ${errors} failed` : ''}`;

      fileList.innerHTML = items.map(item => {
        const thumb = URL.createObjectURL(item.file);
        const isError = item.status === 'error';
        const isDone = item.status === 'done';
        const pct = Math.round(item.progress * 100);
        return `
          <div class="pop flex items-center gap-4 bg-slate-800/60 border border-slate-700/50 rounded-xl p-3" id="row-${item.id}">
            <img src="${thumb}" class="thumb w-14 h-14 rounded-lg bg-slate-700" alt="">
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1">
                <p class="text-sm font-medium truncate">${escapeHtml(item.file.name)}</p>
                <span class="text-xs ${statusColor(item.status)}">${statusLabel(item.status)}</span>
              </div>
              <div class="h-2 progress-bg rounded-full overflow-hidden">
                <div class="h-full ${isError ? 'bg-red-500' : isDone ? 'bg-green-500' : 'bg-blue-500'} progress-fill" style="width: ${pct}%"></div>
              </div>
              ${item.response && item.response.url ? `
                <a href="${item.response.url}" target="_blank" class="text-xs text-blue-400 hover:underline mt-1 inline-block">Open photo</a>
              ` : ''}
            </div>
            ${isError ? `
              <button onclick="retry('${item.id}')" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white" title="Retry">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function statusLabel(s) {
      return { queued: 'Queued', uploading: 'Uploading…', done: 'Done', error: 'Failed' }[s] || s;
    }
    function statusColor(s) {
      return { queued: 'text-slate-400', uploading: 'text-blue-400', done: 'text-green-400', error: 'text-red-400' }[s] || 'text-slate-400';
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    uploadBtn.addEventListener('click', uploadAll);

    function uploadAll() {
      hideStatus();
      items.filter(i => i.status === 'queued' || i.status === 'error').forEach(uploadItem);
    }

    window.retry = function(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.status = 'queued';
      item.progress = 0;
      item.response = null;
      uploadItem(item);
    };

    function uploadItem(item) {
      item.status = 'uploading';
      item.progress = 0;
      render();

      const fd = new FormData();
      fd.append('photo', item.file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload', true);

      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          item.progress = e.loaded / e.total;
          render();
        }
      });

      xhr.addEventListener('load', () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            item.response = JSON.parse(xhr.responseText);
          } catch (e) { item.response = {}; }
          item.status = 'done';
          item.progress = 1;
        } else {
          item.status = 'error';
          item.progress = 1;
        }
        onUploadFinished();
      });

      xhr.addEventListener('error', () => {
        item.status = 'error';
        item.progress = 1;
        onUploadFinished();
      });

      xhr.addEventListener('abort', () => {
        item.status = 'queued';
        item.progress = 0;
        render();
      });

      xhr.send(fd);
    }

    function onUploadFinished() {
      render();
      const done = items.filter(i => i.status === 'done').length;
      const errors = items.filter(i => i.status === 'error').length;
      if (items.every(i => i.status === 'done' || i.status === 'error')) {
        if (errors === 0) {
          showStatus(`All ${done} photo${done === 1 ? '' : 's'} uploaded successfully!`, 'bg-green-500/20 text-green-200');
        } else if (done === 0) {
          showStatus('All uploads failed. Please try again.', 'bg-red-500/20 text-red-200');
        } else {
          showStatus(`${done} uploaded, ${errors} failed.`, 'bg-yellow-500/20 text-yellow-200');
        }
      }
    }

    clearBtn.addEventListener('click', () => {
      items = [];
      fileInput.value = '';
      render();
      hideStatus();
    });

    function showStatus(msg, classes) {
      status.className = `mt-6 p-4 rounded-xl text-center font-medium ${classes}`;
      status.textContent = msg;
      status.classList.remove('hidden');
    }
    function hideStatus() {
      status.classList.add('hidden');
      status.textContent = '';
    }

    async function loadHeaderSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) return;
        const settings = await res.json();
        headerTitle.textContent = (settings.orgShortName ? `${settings.orgShortName} Upload` : (settings.orgName ? `${settings.orgName} Upload` : 'Upload Photos'));
        headerOrg.textContent = settings.orgShortName || settings.orgName || 'Pick or drop multiple images';
        if (settings.logoUrl) {
          headerLogo.src = settings.logoUrl;
          headerLogo.alt = settings.orgName || 'Logo';
          headerLogo.classList.remove('hidden');
          headerFallback.classList.add('hidden');
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadHeaderSettings();
  </script>
</body>
</html>
