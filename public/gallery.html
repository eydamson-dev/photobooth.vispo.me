<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; }
    .photo-card {
      break-inside: avoid;
      margin-bottom: 1rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .4s ease, transform .4s ease, box-shadow .2s ease;
    }
    .photo-card.loaded { opacity: 1; transform: translateY(0); }
    .photo-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,0.35); }
    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      background: #1e293b;
      border-radius: 0.75rem;
    }
    .date-header {
      break-inside: avoid;
      column-span: all;
      margin: 1.5rem 0 0.75rem;
      font-size: 1.125rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .date-header:first-child { margin-top: 0; }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10b981;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
      z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 bg-[#0f172a]/90 backdrop-blur border-b border-slate-700/50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">Snapshots</h1>
          <p class="text-xs text-slate-400"><span id="count">0</span> photos</p>
        </div>
      </div>
      <button id="refresh" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition text-slate-200" title="Refresh">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
    <div id="loading" class="flex items-center justify-center gap-3 py-12 text-slate-400">
      <div class="spinner"></div>
      <span>Loading photos…</span>
    </div>
    <div id="grid" class="columns-2 md:columns-3 lg:columns-4 gap-4"></div>
    <div id="sentinel" class="h-8"></div>
  </main>

  <div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-sm flex items-center justify-center p-4">
    <button id="lb-close" class="absolute top-4 right-4 p-2 rounded-full bg-slate-800/80 text-slate-200 hover:bg-slate-700 transition">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="max-w-5xl max-h-[90vh] w-full flex flex-col items-center">
      <img id="lb-img" src="" alt="" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl">
      <div class="mt-4 flex flex-wrap items-center justify-center gap-3">
        <a id="lb-download" href="" download class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Download
        </a>
        <button id="lb-copy" class="px-5 py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-semibold transition flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          Copy sharing link
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Link copied!</div>

  <script>
    const grid = document.getElementById('grid');
    const loading = document.getElementById('loading');
    const countEl = document.getElementById('count');
    const refreshBtn = document.getElementById('refresh');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbDownload = document.getElementById('lb-download');
    const lbCopy = document.getElementById('lb-copy');
    const lbClose = document.getElementById('lb-close');
    const toast = document.getElementById('toast');

    let photos = [];
    let renderedIndex = 0;
    const batchSize = 20;
    let renderedGroups = new Set();

    const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    const df = new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric', year: 'numeric' });
    const weekday = new Intl.DateTimeFormat('en', { weekday: 'long' });

    function getDateLabel(ts) {
      const d = new Date(ts);
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startOfD = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diffDays = Math.round((startOfD - startOfToday) / 86400000);
      if (diffDays === 0) return 'Today';
      if (diffDays === -1) return 'Yesterday';
      if (diffDays > -7 && diffDays < 0) return weekday.format(d);
      return df.format(d);
    }

    function getDateKey(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function openLightbox(photo) {
      lbImg.src = photo.url;
      lbDownload.href = photo.url;
      lbDownload.download = photo.filename;
      lbCopy.dataset.link = photo.viewUrl;
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    lbCopy.addEventListener('click', async () => {
      const link = lbCopy.dataset.link;
      if (!link) return;
      const full = window.location.origin + link;
      try {
        await navigator.clipboard.writeText(full);
        showToast('Sharing link copied!');
      } catch (err) {
        showToast('Copy failed');
      }
    });

    const imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const card = img.closest('.photo-card');
          img.src = img.dataset.src;
          img.onload = () => card.classList.add('loaded');
          img.onerror = () => { card.classList.add('loaded'); img.style.opacity = 0.3; };
          imgObserver.unobserve(img);
        }
      });
    }, { rootMargin: '100px' });

    function createPhotoCard(photo) {
      const card = document.createElement('figure');
      card.className = 'photo-card rounded-xl cursor-pointer overflow-hidden';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.addEventListener('click', () => openLightbox(photo));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') openLightbox(photo); });

      const img = document.createElement('img');
      img.dataset.src = photo.url;
      img.alt = photo.filename;
      img.loading = 'lazy';
      img.className = 'rounded-xl';

      card.appendChild(img);
      imgObserver.observe(img);
      return card;
    }

    function addDateHeader(label) {
      const h = document.createElement('div');
      h.className = 'date-header';
      h.textContent = label;
      grid.appendChild(h);
    }

    function renderNextBatch() {
      const end = Math.min(renderedIndex + batchSize, photos.length);
      if (renderedIndex === 0) grid.innerHTML = '';

      for (let i = renderedIndex; i < end; i++) {
        const photo = photos[i];
        const key = getDateKey(photo.timestamp);
        if (!renderedGroups.has(key)) {
          renderedGroups.add(key);
          addDateHeader(getDateLabel(photo.timestamp));
        }
        grid.appendChild(createPhotoCard(photo));
      }

      renderedIndex = end;
      if (renderedIndex >= photos.length && loading) {
        loading.style.display = 'none';
      }
    }

    async function loadPhotos() {
      try {
        loading.style.display = 'flex';
        const res = await fetch('/api/photos');
        if (!res.ok) throw new Error('Failed to load');
        photos = await res.json();
        renderedIndex = 0;
        renderedGroups.clear();
        grid.innerHTML = '';
        countEl.textContent = photos.length;
        renderNextBatch();
      } catch (err) {
        console.error(err);
        loading.innerHTML = '<span class="text-red-400">Unable to load photos. Try refreshing.</span>';
      }
    }

    const scrollObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && renderedIndex < photos.length) {
        renderNextBatch();
      }
    }, { rootMargin: '200px' });
    scrollObserver.observe(document.getElementById('sentinel'));

    refreshBtn.addEventListener('click', loadPhotos);

    loadPhotos();
  </script>
</body>
</html>
