<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; }
    .preview { width: 96px; height: 96px; object-fit: contain; border-radius: 12px; background: #fff; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 bg-[#0f172a]/90 backdrop-blur border-b border-slate-700/50">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">Settings</h1>
          <p class="text-xs text-slate-400">Branding & preferences</p>
        </div>
      </div>
      <a href="/" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition">Gallery</a>
    </div>
  </header>

  <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-6">
    <form id="settingsForm" class="space-y-6">
      <!-- Logo -->
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5">
        <label class="block text-sm font-semibold mb-3">Organization Logo</label>
        <div class="flex items-center gap-4 mb-3">
          <img id="logoPreview" src="" alt="Logo preview" class="preview hidden">
          <div id="logoFallback" class="preview flex items-center justify-center bg-slate-700 text-slate-400 text-xs">No logo</div>
        </div>
        <input id="logoInput" type="file" accept="image/*" class="block w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
        <p class="text-xs text-slate-400 mt-2">Upload a square-ish PNG or JPG. Max 5 MB.</p>
      </div>

      <!-- Names -->
      <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5 space-y-4">
        <div>
          <label for="orgName" class="block text-sm font-semibold mb-1.5">Organization Name</label>
          <input id="orgName" name="orgName" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Church of Jesus Christ the Risen Son of God">
        </div>
        <div>
          <label for="orgShortName" class="block text-sm font-semibold mb-1.5">Short Name / Abbreviation</label>
          <input id="orgShortName" name="orgShortName" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="CJCRSG">
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <button id="saveBtn" type="submit" class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
          Save Settings
        </button>
        <span id="status" class="text-sm font-medium"></span>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('settingsForm');
    const logoInput = document.getElementById('logoInput');
    const logoPreview = document.getElementById('logoPreview');
    const logoFallback = document.getElementById('logoFallback');
    const orgNameInput = document.getElementById('orgName');
    const orgShortNameInput = document.getElementById('orgShortName');
    const saveBtn = document.getElementById('saveBtn');
    const statusEl = document.getElementById('status');

    let currentLogoUrl = '';

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) throw new Error('Failed');
        const settings = await res.json();
        orgNameInput.value = settings.orgName || '';
        orgShortNameInput.value = settings.orgShortName || '';
        currentLogoUrl = settings.logoUrl || '';
        updateLogoPreview(currentLogoUrl);
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Could not load settings';
        statusEl.className = 'text-sm font-medium text-red-400';
      }
    }

    function updateLogoPreview(url) {
      if (url) {
        logoPreview.src = url + '?t=' + Date.now();
        logoPreview.classList.remove('hidden');
        logoFallback.classList.add('hidden');
      } else {
        logoPreview.src = '';
        logoPreview.classList.add('hidden');
        logoFallback.classList.remove('hidden');
      }
    }

    logoInput.addEventListener('change', () => {
      const file = logoInput.files[0];
      if (file) {
        logoPreview.src = URL.createObjectURL(file);
        logoPreview.classList.remove('hidden');
        logoFallback.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Saving…';
      statusEl.className = 'text-sm font-medium text-slate-400';
      saveBtn.disabled = true;

      const fd = new FormData();
      fd.append('orgName', orgNameInput.value.trim());
      fd.append('orgShortName', orgShortNameInput.value.trim());
      if (logoInput.files[0]) {
        fd.append('logo', logoInput.files[0]);
      }

      try {
        const res = await fetch('/api/settings', { method: 'POST', body: fd });
        const data = await res.json();
        if (res.ok && data.success) {
          statusEl.textContent = 'Saved!';
          statusEl.className = 'text-sm font-medium text-green-400';
          currentLogoUrl = data.settings.logoUrl || '';
          updateLogoPreview(currentLogoUrl);
          logoInput.value = '';
        } else {
          throw new Error(data.error || 'Save failed');
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message || 'Save failed';
        statusEl.className = 'text-sm font-medium text-red-400';
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadSettings();
  </script>
</body>
</html>
